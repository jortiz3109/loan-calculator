apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-comparison-tool
  labels:
    app: credit-comparison-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-comparison-tool
  template:
    metadata:
      labels:
        app: credit-comparison-tool
    spec:
      containers:
        - name: credit-comparison-tool
          image: ghcr.io/your-github-username/credit-comparison-tool:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
